name: students-ai-usage
services:
  db:
    extends:
      file: docker-compose.db.yml
      service: db
  backend:
    build: ./backend
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 characters)}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      DATABASE_URL: postgresql://${POSTGRES_USER:-students}:${POSTGRES_PASSWORD:-students_dev}@db:5432/${POSTGRES_DB:-students_ai_usage}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 10
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres_data:
